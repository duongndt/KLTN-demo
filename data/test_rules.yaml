openapi: 3.0.3
info:
  title: Test BOLA rules
  version: "1.0"
paths:
  /health:
    get:
      responses:
        "200": { description: OK }
  /products:
    get:
      parameters:
        - { name: limit, in: query, schema: { type: integer } }
      responses:
        "200": { description: OK }
  /public/{itemId}:
    get:
      parameters:
        - { name: itemId, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: OK }
  /orders/{orderId}:
    get:
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: orderId, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: OK }
  /vehicles/{vehicleId}/location:
    get:
      security: [{ bearerAuth: [] }]
      parameters:
        - {
            name: vehicleId,
            in: path,
            required: true,
            schema: { type: string, format: uuid },
          }
      responses:
        "200": { description: OK }
  /batch/orders:
    post:
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                orderId: { type: array, items: { type: integer } }
      responses:
        "200": { description: OK }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer }
